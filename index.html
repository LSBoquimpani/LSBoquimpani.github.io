<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Sala de Aula</title>
<style>html,body{margin:0;height:100%;background:#101418;color:#cfd8e3;font:16px system-ui,sans-serif}#m{height:100%;display:flex;align-items:center;justify-content:center}</style></head>
<body><div id="m">Carregando o jogo…</div>
<script>
(async()=>{try{
const N=12,u=[];
for(let i=1;i<=N;i++)u.push(fetch('p'+String(i-1).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw new Error('parte '+i);return r.text()}));
const s=(await Promise.all(u)).map(x=>x.trim()).join('');
const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.open();document.write(t);document.close();
}catch(e){document.getElementById('m').textContent='Erro ao carregar o jogo: '+e.message}})();
</script></body></html>
